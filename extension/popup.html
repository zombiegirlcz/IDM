<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>IDM-like Capture</title>
    <style>
      body { width: 360px; margin: 0; padding: 12px; font: 13px/1.4 Arial, sans-serif; }
      h1 { font-size: 14px; margin: 0 0 8px; }
      .row { margin-bottom: 8px; }
      .muted { color: #666; font-size: 12px; }
      select { width: 100%; padding: 4px; }
      button { padding: 6px 10px; cursor: pointer; }
      #status { margin-top: 8px; font-size: 12px; }
      .err { color: #aa0000; }
      .ok { color: #0a6b0a; }
    </style>
  </head>
  <body>
    <h1>IDM — nabídka stažení</h1>
    <div class="row muted" id="url">…</div>
    <div class="row">
      <label for="format" class="muted">Formát</label>
      <select id="format">
        <option value="">nejlepší dostupný</option>
      </select>
    </div>
    <div class="row">
      <button id="download">Stáhnout</button>
      <button id="refresh">Načíst formáty</button>
    </div>
    <div id="status" class="muted"></div>
    <script src="popup.js"></script>
  </body>
</html>
