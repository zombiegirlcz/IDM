name: test

# Enforces the full matrix on every push/PR (WITH_RUST=1, which a plain local
# `npm test` leaves off so it compiles no Rust):
#   cargo build --release  (so the release_host staleness guard is meaningful)
#   cargo test
#   node --test extension/test/*.test.mjs  (excluding the real-Chromium E2E)
#
# The two real-browser harnesses run in their own blocking jobs: `chrome-e2e`
# (Playwright + Chromium under Xvfb) and `firefox-e2e` (Marionette, headless). Locally it is a gated step of `npm test`
# that skips itself where Chromium cannot start; this job sets RUN_CHROME_E2E=1,
# which turns that skip into a failure. The Windows installer
# gets a `windows-installer` job that at least parses install.ps1 with
# PowerShell, which no other job can do.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # Pinned rather than ubuntu-latest: the label moves to Ubuntu 26 on
    # 2026-10-19, and a runner image change is not something a push should
    # discover for us. Bump deliberately.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            engine/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('engine/Cargo.lock') }}

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install JS dependencies
        run: npm install

      # What the suites need beyond Rust/Node:
      #   desktop-file-validate  — validates the generated .desktop files
      #   python3-tk + xvfb      — the native Tk window tests build a real window
      #   python3-pil(.imagetk)  — the toolbar/category icons are drawn with PIL
      #   ffmpeg + x11-apps      — the two --screenshot capture paths; with
      #                            ffmpeg present the PNG branch is the one
      #                            tested, including "is the window actually
      #                            drawn in this picture"
      #   python3-pil            — also how that check counts colours
      # Without these the suites either silently skip (locally) or fail (here).
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils python3-tk xvfb \
                                  python3-pil python3-pil.imagetk x11-apps ffmpeg

      # WITH_RUST=1 turns on the two cargo steps, which `npm test` skips by
      # default (a local run needs no toolchain). The release build runs first,
      # so a cached engine/target cannot cause a false "release binary is
      # STALE" — and the release_host guard fails rather than skips here.
      - name: Run full test matrix
        run: WITH_RUST=1 npm test

  # The published binaries are built with --features keyring (see
  # release.yml), which pulls in a Secret Service backend the default build
  # never compiles. Without this job that feature's first compile would happen
  # while cutting a release.
  keyring-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install keyring backend headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Build with the keyring feature
        working-directory: engine
        run: cargo build --features keyring

  chrome-e2e:
    # The only test that exercises the real browser -> content.js -> background
    # -> native host chain with genuinely trusted user events. Blocking: it has
    # passed every run since it was introduced, and RUN_CHROME_E2E=1 below also
    # makes a missing Chromium/Xvfb a failure, so this job cannot pass by
    # quietly testing nothing.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install JS dependencies
        run: npm install

      # NOT Ubuntu's chromium-browser: on noble it is a snap shim, and snap
      # confinement makes Chrome unable to find a native-messaging host outside
      # the snap's own directories ("Specified native messaging host not
      # found"), which is exactly what this test exercises. Playwright's
      # unconfined build has no such limitation.
      - name: Install Playwright Chromium + Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          node node_modules/playwright-core/cli.js install --with-deps chromium

      - name: Build engine + host
        run: cd engine && cargo build --release

      # Resolving Chromium, deciding about xvfb-run and failing on a missing
      # prerequisite all live in chromeE2eMode() now, so this job runs the same
      # path a developer gets locally — just with the skip turned into a fail.
      - name: Run the real-Chromium E2E
        env:
          RUN_CHROME_E2E: '1'
        run: |
          IFS=$'\t' read -r MODE BIN XVFB REASON < <(node extension/chrome_e2e_decide.mjs)
          echo "mode=$MODE chromium=$BIN xvfb=${XVFB:-no} ${REASON}"
          [ "$MODE" = run ] || { echo "::error::$REASON"; exit 1; }
          if [ -n "$XVFB" ]; then
            CHROMIUM_BIN="$BIN" xvfb-run -a node --test extension/test/chrome_e2e.test.mjs
          else
            CHROMIUM_BIN="$BIN" node --test extension/test/chrome_e2e.test.mjs
          fi

  firefox-e2e:
    # The Firefox half of the real-browser coverage. Separate job, not another
    # step of `test`: it takes minutes, and a Firefox problem should be legible
    # as a Firefox problem. Blocking for the same reason chrome-e2e is.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install JS dependencies
        run: npm install

      # The runner image ships Firefox, but as a snap on newer Ubuntu, and snap
      # confinement stops it reading a native-messaging manifest from a test's
      # throwaway HOME. The Mozilla apt build has no such limitation.
      - name: Install Firefox (deb, not snap)
        run: |
          sudo install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://packages.mozilla.org/apt/repo-signing-key.gpg \
            | sudo tee /etc/apt/keyrings/packages.mozilla.org.asc > /dev/null
          echo "deb [signed-by=/etc/apt/keyrings/packages.mozilla.org.asc] \
            https://packages.mozilla.org/apt mozilla main" \
            | sudo tee /etc/apt/sources.list.d/mozilla.list > /dev/null
          printf 'Package: *\nPin: origin packages.mozilla.org\nPin-Priority: 1000\n' \
            | sudo tee /etc/apt/preferences.d/mozilla > /dev/null
          sudo apt-get update
          sudo apt-get install -y --allow-downgrades firefox
          firefox --version

      - name: Build engine + host
        run: cd engine && cargo build --release

      - name: Run the real-Firefox E2E
        env:
          RUN_FIREFOX_E2E: '1'
        run: |
          IFS=$'\t' read -r MODE BIN REASON < <(node extension/firefox_e2e_decide.mjs)
          echo "mode=$MODE firefox=$BIN ${REASON}"
          [ "$MODE" = run ] || { echo "::error::$REASON"; exit 1; }
          FIREFOX_BIN="$BIN" node --test extension/test/firefox_e2e.test.mjs

  windows-installer:
    # install.ps1 is Windows-only, so this is the one place it can actually be
    # parsed by PowerShell instead of pattern-matched by a Node test.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      # The notification-area icon is ctypes against shell32/user32, which
      # exists only here. Creates the real icon, checks Shell_NotifyIcon
      # accepted it, removes it and checks the tray thread ended.
      - name: Tray icon (Shell_NotifyIcon)
        shell: pwsh
        run: |
          python gui/idm_gui.py --selftest-tray
          if ($LASTEXITCODE -ne 0) { throw "tray selftest failed" }

      - name: Parse install.ps1
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path ./install.ps1), [ref]$null, [ref]$errors) | Out-Null
          if ($errors -and $errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Host $_.Message }
            throw "install.ps1 has $($errors.Count) parse error(s)"
          }
          Write-Host "install.ps1 parses cleanly"

      - name: Lint install.ps1
        shell: pwsh
        continue-on-error: true
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -ErrorAction Stop
          Invoke-ScriptAnalyzer -Path ./install.ps1 -Severity Error

      # The wrapper Chrome launches is built by two pure functions; this runs
      # them on paths a real install never gets here (a Czech user name, a
      # literal %, a sibling of the prefix).
      - name: Host wrapper lines
        shell: pwsh
        run: ./test/install_ps1_wrapper.ps1

      # Run it for real against a locally built archive: install, check what
      # landed, then uninstall through the copy it keeps in the prefix. Nothing
      # here touches the network or a release.
      - name: Install and uninstall for real
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage  = Join-Path $env:RUNNER_TEMP 'stage'
          $prefix = Join-Path $env:RUNNER_TEMP 'idm-prefix'
          $dl     = Join-Path $env:RUNNER_TEMP 'idm-downloads'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          # Stand-ins for the binaries: the installer only copies and registers.
          'exit 0' | Set-Content (Join-Path $stage 'idm.exe')
          'exit 0' | Set-Content (Join-Path $stage 'idm-host.exe')
          '# gui'  | Set-Content (Join-Path $stage 'idm_gui.py')
          Copy-Item ./install.ps1 $stage
          Copy-Item ./scripts/ensure-aria2.ps1 $stage
          # The shortcut's icon comes out of the archive, like on Linux.
          New-Item -ItemType Directory -Force -Path (Join-Path $stage 'assets') | Out-Null
          Copy-Item ./assets/idm.ico (Join-Path $stage 'assets')
          Copy-Item ./assets/idm.png (Join-Path $stage 'assets')
          # The extension travels in the zip, as release.yml packs it.
          Copy-Item -Recurse ./extension (Join-Path $stage 'extension')
          $zip = Join-Path $env:RUNNER_TEMP 'idm-windows-x64.zip'
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip -Force
          $sha = (Get-FileHash $zip -Algorithm SHA256).Hash
          "$sha  idm-windows-x64.zip" | Set-Content "$zip.sha256"
          $url = ([System.Uri](Resolve-Path $zip).Path).AbsoluteUri
          # Where 2.1.9 put the Chrome manifest; it pointed at bin\idm-host.exe.
          New-Item -ItemType Directory -Force -Path $prefix | Out-Null
          '{"path": "stale"}' | Set-Content (Join-Path $prefix 'com.tonec.idm.json')

          ./install.ps1 -ArchiveUrl $url -Prefix $prefix -DownloadsDir $dl

          # The flat archive must have been arranged into the same layout
          # install.sh builds, so one IDM_DIR means one thing on both systems.
          foreach ($f in 'bin\idm.exe', 'bin\idm-host.exe', 'bin\ensure-aria2.ps1',
                         'gui\idm_gui.py', 'assets\idm.ico', 'install.ps1', 'VERSION',
                         'extension\manifest.json', 'extension\background.js',
                         'extension\content.js') {
            if (-not (Test-Path (Join-Path $prefix $f))) { throw "missing after install: $f" }
          }
          if ([Environment]::GetEnvironmentVariable('IDM_DIR', 'User') -ne $prefix) {
            throw "IDM_DIR was not persisted"
          }
          $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          if ($userPath -notlike "*$prefix\bin*") { throw "bin not on the user PATH" }
          $reg = 'HKCU:\Software\Google\Chrome\NativeMessagingHosts\com.tonec.idm'
          if (-not (Test-Path $reg)) { throw "native messaging host not registered" }

          # The browser launches a wrapper that carries the flags itself: a
          # Chrome started before this install never sees the new user
          # variables, and the host fails closed without --allowed-dir.
          $native  = Join-Path $prefix 'native'
          $wrapper = Join-Path $native 'idm-host.cmd'
          if (-not (Test-Path $wrapper)) { throw "no native\idm-host.cmd" }
          $w = Get-Content $wrapper
          if ($w[0] -ne '@echo off') { throw "the wrapper must start with @echo off: $($w[0])" }
          foreach ($flag in '--engine', '--allowed-dir', '--settings', 'idm-host.exe', '%*') {
            if (($w -join "`n") -notlike "*$flag*") { throw "the wrapper lacks $flag`n$($w -join "`n")" }
          }
          if (Test-Path (Join-Path $prefix 'com.tonec.idm.json')) { throw "the old root manifest is still there" }

          function Read-Manifest([string]$path) {
            $bytes = [System.IO.File]::ReadAllBytes($path)
            if ($bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF) {
              throw "$path starts with a BOM"
            }
            return ([System.Text.Encoding]::UTF8.GetString($bytes) | ConvertFrom-Json)
          }
          $chrome  = Join-Path $native 'com.tonec.idm.json'
          $firefox = Join-Path $native 'com.tonec.idm.firefox.json'
          $cm = Read-Manifest $chrome
          $fm = Read-Manifest $firefox
          foreach ($m in $cm, $fm) {
            if ($m.path -ne $wrapper) { throw "manifest path is $($m.path), not the wrapper" }
            if ($m.name -ne 'com.tonec.idm' -or $m.type -ne 'stdio') { throw "manifest name/type wrong" }
          }
          if ((@($cm.allowed_origins) -join ',') -ne 'chrome-extension://gnhajaopemmibmjhkaafdebogmkkcljc/') {
            throw "Chrome allowed_origins: $($cm.allowed_origins)"
          }
          if ((@($fm.allowed_extensions) -join ',') -ne 'idm@tonec.local') {
            throw "Firefox allowed_extensions: $($fm.allowed_extensions)"
          }
          if ($fm.allowed_origins -or $cm.allowed_extensions) { throw "a manifest carries the other browser's key" }

          $chromeKeys = 'Google\Chrome', 'Microsoft\Edge', 'BraveSoftware\Brave-Browser', 'Chromium' |
            ForEach-Object { "HKCU:\Software\$_\NativeMessagingHosts\com.tonec.idm" }
          foreach ($k in $chromeKeys) {
            $v = (Get-Item $k).GetValue('')
            if ($v -ne $chrome) { throw "$k -> $v, not $chrome" }
          }
          $mozilla = 'HKCU:\Software\Mozilla\NativeMessagingHosts\com.tonec.idm'
          if (-not (Test-Path $mozilla)) { throw "Firefox host not registered" }
          if ((Get-Item $mozilla).GetValue('') -ne $firefox) { throw "$mozilla does not point at $firefox" }

          # `idm --gui` starts the window with the interpreter the installer found.
          $py = [Environment]::GetEnvironmentVariable('IDM_PYTHON', 'User')
          if (-not $py -or -not (Test-Path $py)) { throw "IDM_PYTHON not persisted: '$py'" }

          # The queue and the vault outlive a plain -Uninstall, as on Linux.
          '{"items": []}' | Set-Content (Join-Path $prefix 'state\queue.json')
          & (Join-Path $prefix 'install.ps1') -Uninstall
          $kept = @(Get-ChildItem -Force $prefix | ForEach-Object Name)
          if (($kept -join ',') -ne 'state') { throw "-Uninstall left: $($kept -join ', ')" }
          if (-not (Test-Path (Join-Path $prefix 'state\queue.json'))) { throw "-Uninstall threw state\ away" }
          foreach ($k in @($chromeKeys) + $mozilla) {
            if (Test-Path $k) { throw "$k still present after -Uninstall" }
          }
          foreach ($v in 'IDM_DIR', 'IDM_PYTHON', 'IDM_ALLOWED_DIR', 'IDM_SETTINGS') {
            if ([Environment]::GetEnvironmentVariable($v, 'User')) { throw "$v survived -Uninstall" }
          }

          ./install.ps1 -Uninstall -Purge -Prefix $prefix
          if (Test-Path $prefix) { throw "prefix still present after -Uninstall -Purge" }
          Write-Host "install + uninstall OK"

      # Installs before 0.2 lived in %LOCALAPPDATA%\idm, and its window or the
      # browser's host may still be running from there: the directory cannot
      # be deleted then, and the old host stays registered under a dead tree.
      - name: Migrate from a running pre-0.2 installation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $old = Join-Path $env:LOCALAPPDATA 'idm'
          New-Item -ItemType Directory -Force -Path (Join-Path $old 'state') | Out-Null
          Copy-Item (Join-Path $env:SystemRoot 'System32\PING.EXE') (Join-Path $old 'idm-host.exe')
          '{"items": ["old"]}' | Set-Content (Join-Path $old 'state\queue.json')
          $p = Start-Process (Join-Path $old 'idm-host.exe') -ArgumentList '-n', '900', '127.0.0.1' -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 2
          if ($p.HasExited) { throw "the old host did not stay running" }

          $stage  = Join-Path $env:RUNNER_TEMP 'stage-migrate'
          $prefix = Join-Path $env:RUNNER_TEMP 'idm-migrate'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          'exit 0' | Set-Content (Join-Path $stage 'idm.exe')
          'exit 0' | Set-Content (Join-Path $stage 'idm-host.exe')
          '# gui'  | Set-Content (Join-Path $stage 'idm_gui.py')
          Copy-Item ./install.ps1 $stage
          New-Item -ItemType Directory -Force -Path (Join-Path $stage 'assets') | Out-Null
          Copy-Item ./assets/idm.ico, ./assets/idm.png (Join-Path $stage 'assets')
          Copy-Item -Recurse ./extension (Join-Path $stage 'extension')
          $zip = Join-Path $env:RUNNER_TEMP 'migrate.zip'
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip -Force
          $url = ([System.Uri](Resolve-Path $zip).Path).AbsoluteUri

          ./install.ps1 -ArchiveUrl $url -Prefix $prefix -DownloadsDir (Join-Path $env:RUNNER_TEMP 'dl-migrate')

          if (-not $p.HasExited) { $p | Stop-Process -Force; throw "the old installation's host was left running" }
          if (Test-Path $old) { throw "%LOCALAPPDATA%\idm is still there" }
          if ((Get-Content (Join-Path $prefix 'state\queue.json') -Raw) -notmatch 'old') { throw "state was not migrated" }
          ./install.ps1 -Uninstall -Purge -Prefix $prefix
          Write-Host "migration from a running pre-0.2 installation OK"

      # Reported: "installing on Windows still gives the old 2.0.7". On a real
      # machine the browser keeps idm-host.exe running and the window keeps
      # idm.exe running, and Windows will not delete or overwrite an exe that
      # is in use -- so a reinstall over a live installation must stop those
      # processes first, or it leaves the old files in place.
      - name: Upgrade over a running installation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $prefix = Join-Path $env:RUNNER_TEMP 'idm-upgrade'
          $dl     = Join-Path $env:RUNNER_TEMP 'idm-upgrade-dl'
          function New-Archive([string]$tag, [string]$exe) {
            $stage = Join-Path $env:RUNNER_TEMP "stage-$tag"
            New-Item -ItemType Directory -Force -Path $stage | Out-Null
            # Real executables, so they can run and hold their files open.
            Copy-Item $exe (Join-Path $stage 'idm.exe')
            Copy-Item $exe (Join-Path $stage 'idm-host.exe')
            "VERSION = `"$tag`"" | Set-Content (Join-Path $stage 'idm_gui.py')
            Copy-Item ./install.ps1 $stage
            Copy-Item ./scripts/ensure-aria2.ps1 $stage
            New-Item -ItemType Directory -Force -Path (Join-Path $stage 'assets') | Out-Null
            Copy-Item ./assets/idm.ico, ./assets/idm.png (Join-Path $stage 'assets')
            $dir = Join-Path $env:RUNNER_TEMP "archive-$tag"
            New-Item -ItemType Directory -Force -Path $dir | Out-Null
            $zip = Join-Path $dir 'idm-windows-x64.zip'
            Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip -Force
            $sha = (Get-FileHash $zip -Algorithm SHA256).Hash
            "$sha  idm-windows-x64.zip" | Set-Content "$zip.sha256"
            return ([System.Uri](Resolve-Path $zip).Path).AbsoluteUri
          }
          $oldExe = Join-Path $env:SystemRoot 'System32\PING.EXE'
          $newExe = Join-Path $env:SystemRoot 'System32\HOSTNAME.EXE'

          ./install.ps1 -ArchiveUrl (New-Archive '2.0.7' $oldExe) -Prefix $prefix -DownloadsDir $dl
          $running = @(
            Start-Process (Join-Path $prefix 'bin\idm.exe') -ArgumentList '-n','900','127.0.0.1' -PassThru -WindowStyle Hidden
            Start-Process (Join-Path $prefix 'bin\idm-host.exe') -ArgumentList '-n','900','127.0.0.1' -PassThru -WindowStyle Hidden
          )
          Start-Sleep -Seconds 2
          # What 2.1.9's `idm update` left behind on a real machine: the old
          # bin\ it could not delete (its own exe was running), plus whatever
          # an interrupted run leaves. A reinstall stops the processes, so it
          # can and must clear them.
          New-Item -ItemType Directory -Force -Path (Join-Path $prefix 'bin.old'),
            (Join-Path $prefix 'extension.old'), (Join-Path $prefix '.update\unpack'),
            (Join-Path $prefix '.trash\bin-1') | Out-Null
          Copy-Item $oldExe (Join-Path $prefix 'bin.old\idm.exe')
          '2.0.6' | Set-Content (Join-Path $prefix 'VERSION.old')

          ./install.ps1 -ArchiveUrl (New-Archive '2.1.7' $newExe) -Prefix $prefix -DownloadsDir $dl

          $left = @(Get-ChildItem -Force $prefix | Where-Object {
            $_.Name -match '\.old$' -or $_.Name -in '.update', '.trash' } | ForEach-Object Name)
          if ($left) { throw "a reinstall left behind: $($left -join ', ')" }

          $gui = Get-Content (Join-Path $prefix 'gui\idm_gui.py') -Raw
          if ($gui -notmatch '2\.1\.7') { throw "gui\idm_gui.py is still the old one: $gui" }
          $want = (Get-FileHash $newExe).Hash
          foreach ($b in 'idm.exe', 'idm-host.exe') {
            if ((Get-FileHash (Join-Path $prefix "bin\$b")).Hash -ne $want) { throw "bin\$b is still the old one" }
          }
          $ver = (Get-Content (Join-Path $prefix 'VERSION') -Raw).Trim()
          if ($ver -ne '2.1.7') { throw "VERSION says '$ver', not the version installed" }
          $running | ForEach-Object { if (-not $_.HasExited) { $_ | Stop-Process -Force } }
          & (Join-Path $prefix 'install.ps1') -Uninstall
          Write-Host "upgrade over a running installation OK"

  windows-host:
    # The browser -> host link on Windows, with the real idm-host.exe, found
    # the way Chrome finds it: HKCU registry -> manifest -> `path`, launched
    # through cmd.exe. Reported from 2.1.9: Chrome "could not talk to IDM". A
    # browser started before the install never sees the user variables the
    # installer persists, so a host launched with no flags failed closed --
    # this clears them in the child, exactly that browser's view.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - name: Build engine + host
        working-directory: engine
        run: cargo build --release --bin idm-host --bin idm

      - name: Native message through the registered manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root  = Join-Path $env:RUNNER_TEMP 'host'
          $stage = Join-Path $root 'stage'
          # A Czech user name in both paths: the wrapper is a batch file, and
          # cmd.exe reads those in the OEM code page.
          $c = [string][char]0x010D
          $prefix = Join-Path $root "idm-$c"
          $dl     = Join-Path $env:USERPROFILE "Downloads\idm-ci-$c"
          New-Item -ItemType Directory -Force -Path $stage, (Join-Path $stage 'assets') | Out-Null
          Copy-Item engine/target/release/idm.exe, engine/target/release/idm-host.exe $stage
          Copy-Item ./gui/idm_gui.py, ./install.ps1 $stage
          Copy-Item ./scripts/ensure-aria2.ps1, ./scripts/ensure-ytdlp.ps1 $stage
          Copy-Item ./assets/idm.ico, ./assets/idm.png (Join-Path $stage 'assets')
          Copy-Item -Recurse ./extension (Join-Path $stage 'extension')
          $zip = Join-Path $root 'idm-windows-x64.zip'
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip -Force
          $url = ([System.Uri](Resolve-Path $zip).Path).AbsoluteUri

          ./install.ps1 -ArchiveUrl $url -Prefix $prefix -DownloadsDir $dl
          # Something for get_settings to find, so the reply proves --settings
          # reached the host (with IDM_SETTINGS cleared below).
          '{"min_size_kb": 1}' | Set-Content (Join-Path $prefix 'state\settings.json')

          $manifest = (Get-Item 'HKCU:\Software\Google\Chrome\NativeMessagingHosts\com.tonec.idm').GetValue('')
          $hostPath = (Get-Content $manifest -Raw | ConvertFrom-Json).path
          Write-Host "manifest $manifest -> $hostPath"

          # How Chrome launches a host on Windows (native_process_launcher_win):
          # cmd.exe /d /s /c with the quoted path and the origin, cwd = the
          # host's own directory.
          $psi = [System.Diagnostics.ProcessStartInfo]::new($env:ComSpec)
          $psi.Arguments = "/d /s /c `"`"$hostPath`" chrome-extension://gnhajaopemmibmjhkaafdebogmkkcljc/ --parent-window=0`""
          $psi.WorkingDirectory = Split-Path -Parent $hostPath
          $psi.UseShellExecute = $false
          $psi.RedirectStandardInput = $true
          $psi.RedirectStandardOutput = $true
          $psi.RedirectStandardError = $true
          $psi.CreateNoWindow = $true
          foreach ($v in 'IDM_ALLOWED_DIR', 'IDM_SETTINGS') { [void]$psi.Environment.Remove($v) }
          $p = [System.Diagnostics.Process]::Start($psi)
          $err = $p.StandardError.ReadToEndAsync()

          $in = $p.StandardInput.BaseStream
          foreach ($req in '{"id":1,"action":"ping"}', '{"id":2,"action":"get_settings"}') {
            $body = [System.Text.Encoding]::UTF8.GetBytes($req)
            $in.Write([BitConverter]::GetBytes([uint32]$body.Length), 0, 4)
            $in.Write($body, 0, $body.Length)
          }
          $in.Flush()
          $in.Close()   # EOF: the host answers what it has and exits

          $buf = [System.IO.MemoryStream]::new()
          $copy = $p.StandardOutput.BaseStream.CopyToAsync($buf)
          if (-not $copy.Wait(60000)) { $p.Kill(); throw "the host did not finish in 60 s" }
          $p.WaitForExit()
          $bytes = $buf.ToArray()
          Write-Host "exit $($p.ExitCode), $($bytes.Length) bytes on stdout, stderr: $($err.Result)"

          # Every byte on stdout must belong to a frame: one echoed line from
          # the batch file and Chrome reads garbage as a length.
          $replies = @{}
          $at = 0
          while ($at -lt $bytes.Length) {
            if ($at + 4 -gt $bytes.Length) { throw "stray bytes at $at of $($bytes.Length)" }
            $len = [BitConverter]::ToUInt32($bytes, $at)
            if ($at + 4 + $len -gt $bytes.Length) { throw "frame at $at claims $len bytes; stdout is not just frames" }
            $msg = [System.Text.Encoding]::UTF8.GetString($bytes, $at + 4, $len) | ConvertFrom-Json
            $replies[[int]$msg.id] = $msg
            $at += 4 + $len
          }
          if ($replies.Count -ne 2) { throw "expected 2 replies, got $($replies.Count)" }
          $ping = $replies[1]
          if (-not $ping.ok -or $ping.msg -ne 'pong') { throw "ping: $($ping | ConvertTo-Json -Compress)" }
          $set = $replies[2]
          if (-not $set.ok -or $set.source -ne 'file') {
            throw "get_settings did not read state\settings.json: $($set | ConvertTo-Json -Compress)"
          }
          if ($p.ExitCode -ne 0) { throw "host exited $($p.ExitCode)" }

          & (Join-Path $prefix 'install.ps1') -Uninstall -Purge
          if (Test-Path $prefix) { throw "-Purge left $prefix" }
          Write-Host "native messaging through the registered wrapper OK"

  windows-update:
    # `idm update` on a real Windows machine, with the real engine. Reported
    # from 2.1.9: bin.old\ stayed behind after every update (the updater and
    # the window's server run from it, and Windows will not delete a running
    # exe), and extension\ came out EMPTY because the zip had none -- Chrome
    # then refused to load it. Nothing but Windows can show either.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - name: Build engine
        working-directory: engine
        run: cargo build --release --bin idm

      - name: Update a running installation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe  = (Resolve-Path engine/target/release/idm.exe).Path
          $root = Join-Path $env:RUNNER_TEMP 'upd'
          $I    = Join-Path $root 'idm'
          $srv  = Join-Path $root 'srv'
          $stage = Join-Path $root 'stage'

          # The installation as it stands: the real engine in bin\, and an
          # extension folder the user loaded into Chrome.
          foreach ($d in 'bin', 'gui', 'assets', 'state', 'extension') {
            New-Item -ItemType Directory -Force -Path (Join-Path $I $d) | Out-Null
          }
          Copy-Item $exe (Join-Path $I 'bin\idm.exe')
          Copy-Item (Join-Path $env:SystemRoot 'System32\PING.EXE') (Join-Path $I 'bin\idm-host.exe')
          '# old gui' | Set-Content (Join-Path $I 'gui\idm_gui.py')
          '{"old": true}' | Set-Content (Join-Path $I 'extension\manifest.json')
          '0.0.1' | Set-Content (Join-Path $I 'VERSION')

          # The release, served locally and packed the way release.yml packs it.
          New-Item -ItemType Directory -Force -Path $srv, (Join-Path $stage 'assets') | Out-Null
          Copy-Item $exe (Join-Path $stage 'idm.exe')
          Copy-Item $exe (Join-Path $stage 'idm-host.exe')
          Copy-Item ./gui/idm_gui.py, ./install.ps1 $stage
          Copy-Item ./scripts/ensure-aria2.ps1, ./scripts/ensure-aria2.sh $stage
          Copy-Item ./scripts/ensure-ytdlp.ps1, ./scripts/ensure-ytdlp.sh $stage
          Copy-Item ./assets/idm.ico, ./assets/idm.png (Join-Path $stage 'assets')
          Copy-Item -Recurse ./extension (Join-Path $stage 'extension')
          $zip = Join-Path $srv 'idm-windows-x64.zip'
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip
          $sha = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$sha  idm-windows-x64.zip" | Set-Content "$zip.sha256"
          '{"tag_name": "v9.9.9"}' | Set-Content (Join-Path $srv 'latest.json')
          $http = Start-Process python -ArgumentList '-m', 'http.server', '18765',
            '--bind', '127.0.0.1', '--directory', $srv -PassThru -WindowStyle Hidden
          $deadline = (Get-Date).AddSeconds(20)
          while (-not (Test-NetConnection 127.0.0.1 -Port 18765 -InformationLevel Quiet -WarningAction SilentlyContinue)) {
            if ((Get-Date) -gt $deadline) { throw "local release server did not start" }
            Start-Sleep -Milliseconds 300
          }

          # What runs out of bin\ on a real machine: the browser keeps
          # idm-host.exe alive, the window keeps `idm.exe --serve`.
          $dl = Join-Path $root 'dl'
          New-Item -ItemType Directory -Force -Path $dl | Out-Null
          $held = @(
            Start-Process (Join-Path $I 'bin\idm-host.exe') -ArgumentList '-n', '900', '127.0.0.1' -PassThru -WindowStyle Hidden
            Start-Process (Join-Path $I 'bin\idm.exe') -ArgumentList '--serve', '127.0.0.1:18766',
              '--output-dir', $dl, '--state-dir', (Join-Path $I 'state') -PassThru -WindowStyle Hidden
          )
          Start-Sleep -Seconds 2
          $held | ForEach-Object { if ($_.HasExited) { throw "$($_.Name) did not stay running" } }

          $env:IDM_DIR = $I
          $env:IDM_UPDATE_API = 'http://127.0.0.1:18765/latest.json'
          $env:IDM_UPDATE_BASE = 'http://127.0.0.1:18765'
          & (Join-Path $I 'bin\idm.exe') update
          if ($LASTEXITCODE -ne 0) { throw "idm update failed ($LASTEXITCODE)" }

          $left = @(Get-ChildItem -Force $I | Where-Object { $_.Name -match '\.(old|new|rollback)$' } | ForEach-Object Name)
          if ($left) { throw "left next to bin\ after the update: $($left -join ', ')" }
          foreach ($f in 'extension\manifest.json', 'extension\background.js', 'extension\content.js',
                         'bin\ensure-ytdlp.ps1', 'bin\ensure-aria2.ps1', 'gui\idm_gui.py') {
            if (-not (Test-Path (Join-Path $I $f))) { throw "missing after the update: $f" }
          }
          if ((Get-Content (Join-Path $I 'extension\manifest.json') -Raw) -match '"old"') {
            throw "extension\ was not replaced by the release's"
          }
          if ((Get-Content (Join-Path $I 'VERSION') -Raw).Trim() -ne 'v9.9.9') { throw "VERSION not stamped" }

          # Once nothing runs from the old tree any more, the next command
          # sweeps what the update had to leave.
          foreach ($p in $held) { if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force; $p.WaitForExit() } }
          & (Join-Path $I 'bin\idm.exe') --version
          $rest = @(Get-ChildItem -Force $I | Where-Object { $_.Name -in '.trash', '.update' } | ForEach-Object Name)
          if ($rest) { throw "not swept by the next command: $($rest -join ', ')" }
          Stop-Process -Id $http.Id -Force
          Write-Host "update of a running Windows installation OK"
