name: test

# Enforces the full matrix on every push/PR:
#   cargo build --release  (so the release_host staleness guard is meaningful)
#   cargo test
#   node --test extension/test/*.test.mjs  (excluding the real-Chromium E2E)
#
# The real-Chromium harness (extension/test/chrome_e2e.test.mjs) is NOT run
# here: it needs a working Chromium + display and is blocked in sandboxes.
# Run it manually where Chromium works:
#   xvfb-run -a node --test extension/test/chrome_e2e.test.mjs

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            engine/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('engine/Cargo.lock') }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install JS dependencies
        run: npm install

      # Note: `npm test` runs `cargo build --release` first, so a cached
      # engine/target cannot cause a false "release binary is STALE".
      - name: Run full test matrix
        run: npm test