name: release

# Builds prebuilt binaries on GitHub's runners (NOT on the user's machine) and
# publishes them as release assets. The Windows/Linux installers then just
# download these — no Rust, no git, no compilation for the user.
#
# Trigger: push a tag like v0.1.0, or run manually from the Actions tab.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: idm-windows-x64.zip
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            archive: idm-linux-x64.tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: idm-linux-arm64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # The vault key belongs in the OS keyring, and the keyring backends need
      # a system library. Without this the shipped binary falls back to
      # secrets.key on disk -- which works, but is the weaker half of the
      # design, so the published build is the one that gets the real thing.
      - name: Install keyring backend headers (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Build
        shell: bash
        working-directory: engine
        run: cargo build --release --features keyring --target ${{ matrix.target }}

      - name: Stage artifacts (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          mkdir -p dist
          cp engine/target/${{ matrix.target }}/release/idm.exe dist/
          cp engine/target/${{ matrix.target }}/release/idm-host.exe dist/
          cp gui/idm_gui.py dist/
          cp install.ps1 dist/
          cp scripts/ensure-aria2.ps1 dist/ 2>/dev/null || true
          cp scripts/ensure-aria2.sh dist/ 2>/dev/null || true
          cp scripts/ensure-ytdlp.ps1 dist/ 2>/dev/null || true
          cp scripts/ensure-ytdlp.sh dist/ 2>/dev/null || true
          # The desktop shortcut needs a real icon file; a theme name or a
          # shell32 index is what made it render blank.
          mkdir -p dist/assets && cp assets/idm.ico assets/idm.png dist/assets/
          # The whole extension, as on Linux. Up to 2.1.9 only manifest.json
          # went in (at the zip root, where nothing used it): install.ps1 had
          # no extension\ to install and `idm update` swapped in an empty one,
          # so Chrome's "Load unpacked" found no manifest.
          mkdir -p dist/extension
          cp -r extension/. dist/extension/
          (cd dist && 7z a ../${{ matrix.archive }} .)

      - name: Stage artifacts (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        shell: bash
        run: |
          mkdir -p dist
          cp engine/target/${{ matrix.target }}/release/idm dist/
          cp engine/target/${{ matrix.target }}/release/idm-host dist/
          cp gui/idm_gui.py dist/
          cp scripts/ensure-aria2.sh dist/ 2>/dev/null || true
          cp scripts/ensure-aria2.ps1 dist/ 2>/dev/null || true
          cp scripts/ensure-ytdlp.sh dist/ 2>/dev/null || true
          cp scripts/ensure-ytdlp.ps1 dist/ 2>/dev/null || true
          cp install.sh dist/
          mkdir -p dist/assets && cp assets/idm.ico assets/idm.png dist/assets/
          # Shipping the integration scripts lets an offline install register
          # the browser host without reaching back to raw.githubusercontent.
          # The whole extension/ tree travels with the release so `idm update`
          # refreshes the extension in one swap together with bin/ gui/ assets/.
          mkdir -p dist/extension
          cp -r extension/. dist/extension/
          tar -czf ${{ matrix.archive }} -C dist .

      - name: Checksum
        shell: bash
        run: |
          # install.sh / install.ps1 verify this before unpacking.
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum ${{ matrix.archive }} > ${{ matrix.archive }}.sha256
          else
            shasum -a 256 ${{ matrix.archive }} > ${{ matrix.archive }}.sha256
          fi
          cat ${{ matrix.archive }}.sha256

      # Also keep the archive as a run artifact: a manual (workflow_dispatch)
      # build can then be installed and tested without publishing a release.
      - name: Upload as run artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.archive }}
          path: |
            ${{ matrix.archive }}
            ${{ matrix.archive }}.sha256
          if-no-files-found: error

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            ${{ matrix.archive }}
            ${{ matrix.archive }}.sha256
          fail_on_unmatched_files: true