<!DOCTYPE html>
<html>
<body style="font-family: sans-serif; padding: 24px; background: #f5f5f5;">
<h2 style="color: #333;">Akahu Mock WebView</h2>
<p style="color: #666;">Simulate the Akahu callback by tapping a button below:</p>
<br/>
<button
        onclick="location.href='https://callback.revolut.com/success?action=submitted'"
        style="display:block; width:100%; padding:16px; margin-bottom:12px; font-size:16px; background:#00D64F; color:#fff; border:none; border-radius:8px; cursor:pointer;">
    ✓ Submitted (Success)
</button>
<button
        onclick="location.href='https://callback.revolut.com/success?action=cancelled'"
        style="display:block; width:100%; padding:16px; font-size:16px; background:#e0e0e0; color:#333; border:none; border-radius:8px; cursor:pointer;">
    ✗ Cancelled
</button>
</body>
</html>
