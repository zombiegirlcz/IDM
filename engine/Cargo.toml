[package]
name = "idm-engine"
version = "2.1.9"
edition = "2021"

[[bin]]
name = "idm"
path = "src/main.rs"

[[bin]]
name = "idm-host"
path = "src/bin/idm_host.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "time", "sync", "process", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls"] }
futures-util = "0.3"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crc32fast = "1"
anyhow = "1"
chrono = "0.4"
# Password vault (secrets.json). ChaCha20-Poly1305 rather than AES-GCM: no
# hardware assumption, and it is a pure-Rust addition next to the TLS stack
# reqwest already links.
chacha20poly1305 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
# Verifying the release archive against its published .sha256 during
# `idm update`. The installers do it with sha256sum/Get-FileHash; the engine
# cannot assume either, and this is the same RustCrypto family as the vault's
# cipher rather than a new dependency tree.
sha2 = "0.10"

[features]
# OS keyring for the vault key. Opt-in rather than default: the backends need
# a system library (Secret Service / libdbus on Linux, the native stores
# elsewhere), and a default-on feature would mean a plain `cargo build` fails
# on a machine that lacks it -- the exact "it does not even build" problem the
# design wanted to avoid. Without it the key goes to secrets.key at 0600 and
# the GUI's status line says so rather than claiming keyring protection.
#   cargo build --release --features keyring
default = []
keyring = ["dep:keyring"]

# Used only to signal a whole process group (engine + its aria2c child) on pause.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# One keyring backend per platform; each needs its own feature, and naming them
# per target keeps a Linux build from pulling the macOS store and back.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", optional = true, features = ["sync-secret-service"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", optional = true, features = ["apple-native"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", optional = true, features = ["windows-native"] }

[dev-dependencies]
crc32fast = "1"
serde_json = "1"
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1